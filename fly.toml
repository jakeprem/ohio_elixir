# fly.toml app configuration file generated for ohio-elixir on 2026-01-12T12:40:44-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ohio-elixir'
primary_region = 'ord'
kill_signal = 'SIGTERM'

[build]

[env]
DATABASE_PATH = '/mnt/data/ohio_elixir.db'
PHX_HOST = 'ohioelixir.com'
POOL_SIZE = '5'
PORT = '8080'

[[mounts]]
source = 'ohio_elixir_data'
destination = '/mnt/data'
auto_extend_size_threshold = 80
auto_extend_size_increment = '1GB'
auto_extend_size_limit = '10GB'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[http_service.concurrency]
type = 'connections'
hard_limit = 1000
soft_limit = 1000

[[http_service.checks]]
interval = '30s'
timeout = '5s'
grace_period = '30s'
method = 'GET'
path = '/health'

[[vm]]
size = 'shared-cpu-1x'
memory = '512mb'
