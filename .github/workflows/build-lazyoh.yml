name: Build Lazyoh

on:
  push:
    branches:
      - main
    paths:
      - 'tui/**'
  pull_request:
    paths:
      - 'tui/**'

jobs:
  build:
    name: Build Lazyoh CLI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        working-directory: ./tui
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o lazyoh-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazyoh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tui/lazyoh-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
